# ===========================================
# SmartProperty - SonarQube Cloud configuration
# ===========================================
# Covers the whole monorepo, not just the backend as before: the frontend is
# the larger codebase and was previously unanalysed.
#
# organization and projectKey come from SonarQube Cloud after importing the repo.

sonar.organization=smartproperty-team
sonar.projectKey=smartproperty-team_Smartproperty
sonar.projectName=SmartProperty
sonar.projectVersion=1.0

sonar.sources=backend/src,frontend/src,ai-services/app
sonar.tests=backend/src,frontend/src,ai-services/tests
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx,**/test_*.py

# Tests live next to the code they test, so backend/src and frontend/src are
# both source and test directories. Sonar refuses to index a file as both
# ("can't be indexed twice"), so the test patterns are excluded from sources.
#
# Generated, vendored or archived code is excluded too, so the quality gate
# reflects code that is actually maintained.
sonar.exclusions=\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/.venv311/**,\
  **/__pycache__/**,\
  docs/archive/**,\
  **/*.min.js

# Both reports are written with paths relative to the repository root (see
# coverageReporters in backend/package.json and vitest.config.ts), because
# that is where the scanner resolves them from.
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# ai-services has tests but CI does not run them yet. Once it does, with
# pytest-cov, add: sonar.python.coverage.reportPaths=ai-services/coverage.xml

sonar.sourceEncoding=UTF-8

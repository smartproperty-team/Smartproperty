# ===========================================
# SmartProperty - Build and quality pipeline
# ===========================================
# Fast feedback on every push: typecheck, test with coverage, build both
# applications, compile the Bicep templates, then send coverage and code
# quality to SonarQube Cloud.
#
# Kept separate from security.yml so a slow image scan never delays the signal
# a developer actually waits for, and separate from deploy.yml, which only
# ships what has reached main.

name: CI

on:
  push:
    branches: [main, "chore/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        # Must run inside backend/: it pins TypeScript 4.9 while the workspace
        # root hoists 5.9, and 5.9 rejects this tsconfig's ignoreDeprecations.
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: backend

      - name: Test with coverage
        run: npx jest --coverage --ci --passWithNoTests
        working-directory: backend

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b
        working-directory: frontend

      - name: Test with coverage
        run: npx vitest run --coverage
        working-directory: frontend

      - name: Build
        # A placeholder API URL: this job proves the bundle compiles. The real
        # URL is baked in at deploy time, since VITE_* values are frozen into
        # the bundle at build time and cannot be supplied at runtime.
        run: npm run build --prefix frontend
        env:
          VITE_API_URL: https://example.invalid/api

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: ${{ !cancelled() }}
    steps:
      - name: Decide whether to scan
        id: cfg
        # Two reasons to skip, both reported in the run summary:
        # - no SONAR_TOKEN yet, so the pipeline is green before SonarQube
        #   Cloud is set up rather than permanently red;
        # - any branch other than main outside a pull request. The Free plan
        #   analyses main and pull requests into main only. Other branches are
        #   accepted but their results cannot be read, so the gate check fails.
        run: |
          reason=""
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            reason="SONAR_TOKEN is not set - skipping. See docs/DEVOPS.md."
          elif [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            reason="Not scanned: the SonarQube Cloud Free plan analyses main and pull requests into main only. Open a pull request to get a report."
          fi
          if [ -n "$reason" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "$reason" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          fetch-depth: 0   # Sonar needs history for new-code detection

      - uses: actions/download-artifact@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          name: backend-coverage
          path: backend/coverage
        continue-on-error: true

      - uses: actions/download-artifact@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          name: frontend-coverage
          path: frontend/coverage
        continue-on-error: true

      - name: Make coverage paths repository-relative
        if: steps.cfg.outputs.enabled == 'true'
        # Jest and Vitest write lcov paths relative to their own package
        # (src/...). This scan runs from the repository root, where those
        # paths match nothing, so coverage would silently read 0%. Rewritten
        # here rather than in the test configs because the Jenkins pipelines
        # scan from inside each package and need the paths as they are.
        run: |
          for pkg in backend frontend; do
            f="$pkg/coverage/lcov.info"
            [ -f "$f" ] || { echo "::warning::$f missing - $pkg coverage will read 0%"; continue; }
            sed -i "s#^SF:src/#SF:$pkg/src/#" "$f"
            echo "$f: $(grep -c "^SF:$pkg/src/" "$f") files"
          done

      - name: SonarQube Cloud scan
        if: steps.cfg.outputs.enabled == 'true'
        # v6+ only: v4 and v5 carry two HIGH advisories (GHSA-f79p-9c5r-xg88
        # command injection, GHSA-5xq9-5g24-4g6f argument injection).
        # Always blocking: a scan that fails to run is a broken pipeline, not
        # a quality finding.
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Quality gate
        id: gate
        if: steps.cfg.outputs.enabled == 'true'
        # A separate step so that only the gate result can be advisory.
        # Advisory until the SONAR_GATE_BLOCKING repository variable is
        # 'true': the default gate wants 80% coverage on new code, and the
        # project is far from that, so blocking now would turn every run red.
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.1
        continue-on-error: ${{ vars.SONAR_GATE_BLOCKING != 'true' }}
        timeout-minutes: 6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Report quality gate
        if: steps.cfg.outputs.enabled == 'true' && !cancelled()
        run: |
          status="${{ steps.gate.outputs.quality-gate-status }}"
          if [ "$status" = "PASSED" ]; then
            result="passed"
          elif [ "${{ vars.SONAR_GATE_BLOCKING }}" = "true" ]; then
            result="**${status:-unknown}** (blocking)"
          else
            result="**${status:-unknown}** (advisory - set SONAR_GATE_BLOCKING=true to enforce)"
          fi
          {
            echo "### SonarQube Cloud"
            echo ""
            echo "Quality gate: $result"
            echo ""
            echo "https://sonarcloud.io/project/overview?id=smartproperty-team_Smartproperty"
          } >> "$GITHUB_STEP_SUMMARY"

  infra:
    name: Infrastructure templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and lint Bicep
        # Compiles each template as ARM will receive it and fails on linter
        # errors, so a broken template shows up here rather than when someone
        # applies it by hand.
        run: |
          az bicep install
          for f in infra/*.bicep; do
            echo "::group::$f"
            az bicep build --file "$f" --stdout > /dev/null
            az bicep lint --file "$f"
            echo "::endgroup::"
          done

  summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [backend, frontend, infra, sonar]
    if: always()
    steps:
      - run: |
          {
            echo "### CI"
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Backend | ${{ needs.backend.result }} |"
            echo "| Frontend | ${{ needs.frontend.result }} |"
            echo "| Infrastructure templates | ${{ needs.infra.result }} |"
            echo "| SonarQube Cloud | ${{ needs.sonar.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

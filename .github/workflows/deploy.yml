# ===========================================
# SmartProperty - Build and deploy to Azure
# ===========================================
# Every push to main is tested and built into an image on GHCR. While
# continuous deployment is on (repository variable AZURE_DEPLOY_ENABLED),
# that exact image - by digest - is rolled out to the API, checked, and rolled
# back automatically if the check fails; then the frontend is published.
# Running the workflow by hand always deploys.
#
# Azure sign-in uses OIDC: GitHub's short-lived token is exchanged for an
# Azure one through a federated credential, so no Azure secret is stored
# anywhere. The credential sits on a user-assigned managed identity rather
# than an app registration, because this student tenant forbids those. It
# only trusts jobs running in this repository's `production` environment.
# See infra/README.md, "Continuous deployment".

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One production deploy at a time, in order, and never cancelled half-way.
  group: deploy-production
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: rg-smartproperty
  CONTAINER_APP: ca-smartproperty-api2
  STORAGE_ACCOUNT: stwebsmartpropertybyzjdc
  SITE_URL: https://smartproperties.tech
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/smartproperty-backend

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck backend
        # Must run inside backend/: it pins TypeScript 4.9 while the root
        # hoists 5.9, and 5.9 rejects this tsconfig's ignoreDeprecations value.
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: backend

      - name: Build frontend
        run: npm run build --prefix frontend
        env:
          # Placeholder only: the real build happens in deploy-frontend,
          # once the API URL is known. This job just proves it compiles.
          VITE_API_URL: https://example.invalid/api

  # ---------------------------------------------------------------
  build-image:
    name: Build and push API image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: prod
          push: true
          # Reported by /api/health, so the deploy can tell when this build
          # is the one answering.
          build-args: GIT_COMMIT=${{ github.sha }}
          # Immutable SHA tag so a rollback is one command against a known
          # good build, plus a moving latest for convenience.
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report the image
        env:
          REF: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### API image"
            echo ""
            echo "Built from \`${GITHUB_SHA}\`. To deploy exactly this build by hand:"
            echo ""
            echo '```'
            echo "az containerapp update -n ${CONTAINER_APP} -g ${AZURE_RESOURCE_GROUP} --image ${REF}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------
  deploy-backend:
    name: Deploy API
    needs: build-image
    if: vars.AZURE_DEPLOY_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://smartproperties.tech
    permissions:
      contents: read
      id-token: write # for the OIDC sign-in
    outputs:
      api_url: ${{ steps.api.outputs.url }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/smartproperty-backend@${{ needs.build-image.outputs.digest }}
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Record the running image, for rollback
        id: before
        run: |
          image=$(az containerapp show -n "$CONTAINER_APP" -g "$AZURE_RESOURCE_GROUP" \
            --query 'properties.template.containers[0].image' -o tsv)
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "Running before this deploy: ${image}"

      - name: Roll the API to this build
        run: |
          az containerapp update -n "$CONTAINER_APP" -g "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE" -o none

      - name: Check the new build
        id: api
        run: |
          fqdn=$(az containerapp show -n "$CONTAINER_APP" -g "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          api="https://${fqdn}/api"
          echo "url=${api}" >> "$GITHUB_OUTPUT"

          # 1. Wait (up to 5 minutes) for this commit to be the one answering.
          commit=""
          for attempt in $(seq 1 60); do
            commit=$(curl -fsS -m 10 "${api}/health" | jq -r '.commit // empty' || true)
            [ "$commit" = "$GITHUB_SHA" ] && break
            sleep 5
          done
          if [ "$commit" != "$GITHUB_SHA" ]; then
            echo "::error::The new build never answered; last commit seen: '${commit:-none}'."
            exit 1
          fi
          echo "New build answering after ${attempt} checks."

          # 2. It must then settle: 10 health checks in a row, within 3
          #    minutes. The switch-over can drop a few requests; a build that
          #    keeps failing does not get past this.
          streak=0
          for attempt in $(seq 1 60); do
            if curl -fsS -m 10 -o /dev/null "${api}/health"; then
              streak=$((streak + 1))
              [ "$streak" -ge 10 ] && break
            else
              streak=0
            fi
            sleep 3
          done
          if [ "$streak" -lt 10 ]; then
            echo "::error::The API did not stay healthy after the switch."
            exit 1
          fi

          # 3. /health does not touch the database; the listings do.
          curl -fsS -m 20 -o /dev/null "${api}/properties?limit=1" || {
            echo "::error::GET /properties failed: the API cannot read its database."
            exit 1
          }
          echo "Healthy, and reading from the database."

      - name: Roll back to the previous image
        if: failure() && steps.before.outputs.image != ''
        env:
          PREVIOUS: ${{ steps.before.outputs.image }}
        run: |
          echo "::warning::Deploy failed; rolling back to ${PREVIOUS}"
          az containerapp update -n "$CONTAINER_APP" -g "$AZURE_RESOURCE_GROUP" \
            --image "$PREVIOUS" -o none
          {
            echo "### Rolled back"
            echo ""
            echo "\`${IMAGE}\` failed its checks. The API is back on \`${PREVIOUS}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        run: |
          {
            echo "### API deployed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${IMAGE}\` |"
            echo "| Replaced | \`${{ steps.before.outputs.image }}\` |"
            echo "| API | ${{ steps.api.outputs.url }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------
  deploy-frontend:
    name: Deploy frontend
    needs: deploy-backend
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://smartproperties.tech
    permissions:
      contents: read
      id-token: write # for the OIDC sign-in
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        # VITE_* values are frozen into the bundle at build time. Both keys
        # are public by design: they ship inside the page's JavaScript.
        env:
          VITE_API_URL: ${{ needs.deploy-backend.outputs.api_url }}
          VITE_RECAPTCHA_SITE_KEY: 6LeVNmMsAAAAAH5tfjXkOtyScNdfrptlgxooPLHJ # gitleaks:allow (public site key)
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_51QwtaHCdbmFmls5VgXjMi6xq3hp8X2dSLmYMf0rY9aJROXfe3ZO6Z9mtxejKrKgtT59YtpaG3qpDlp8o7gKh061V00PTfumZHa # gitleaks:allow (publishable key)
        run: npm run build --prefix frontend

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publish the site
        # In three steps so no visitor gets a page whose scripts are missing:
        # the hashed bundles first (cached for a year, since any change gets a
        # new name), then the other files, and index.html last.
        run: |
          # The static website container is literally named $web.
          # shellcheck disable=SC2016
          site='$web'
          mv frontend/dist/index.html "$RUNNER_TEMP/index.html"
          mv frontend/dist/assets "$RUNNER_TEMP/assets"
          upload() {
            az storage blob upload-batch --account-name "$STORAGE_ACCOUNT" \
              --auth-mode login -d "$site" --overwrite --no-progress -o none "$@"
          }
          upload -s "$RUNNER_TEMP/assets" --destination-path assets \
            --content-cache-control 'public, max-age=31536000, immutable'
          upload -s frontend/dist
          az storage blob upload --account-name "$STORAGE_ACCOUNT" \
            --auth-mode login -c "$site" -n index.html -f "$RUNNER_TEMP/index.html" \
            --content-type 'text/html; charset=utf-8' \
            --content-cache-control 'no-cache' --overwrite --no-progress -o none

      - name: Check the live site serves this build
        run: |
          expected=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' "$RUNNER_TEMP/index.html" | head -1)
          for _ in $(seq 1 12); do
            live=$(curl -fsS -m 10 "${SITE_URL}/?deploy=${GITHUB_RUN_ID}" \
              | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -1 || true)
            if [ "$live" = "$expected" ]; then
              echo "${SITE_URL} serves ${expected}"
              echo "### Frontend deployed: ${SITE_URL} (\`${expected}\`)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::${SITE_URL} still serves '${live}', expected '${expected}'."
          exit 1

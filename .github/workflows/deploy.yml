# ===========================================
# SmartProperty - Build and deploy to Azure
# ===========================================
# Authenticates with OIDC federated credentials. No Azure secret is stored
# in GitHub: the workflow exchanges a short-lived GitHub token for an Azure
# one at run time. See infra/README.md for the one-time setup.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_infra:
        description: 'Run the Bicep deployment as well'
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: rg-smartproperty
  AZURE_LOCATION: westeurope
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/smartproperty-backend

permissions:
  contents: read
  packages: write
  id-token: write   # required for OIDC

jobs:
  # ---------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck backend
        # Must run inside backend/: it pins TypeScript 4.9 while the root
        # hoists 5.9, and 5.9 rejects this tsconfig's ignoreDeprecations value.
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: backend

      - name: Build frontend
        run: npm run build --prefix frontend
        env:
          # Placeholder only: the real build happens in deploy-frontend,
          # once the API URL is known. This job just proves it compiles.
          VITE_API_URL: https://example.invalid/api

  # ---------------------------------------------------------------
  build-image:
    name: Build and push API image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: echo "image=${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: prod
          push: true
          # Immutable SHA tag so a rollback is one command against a known
          # good build, plus a moving latest for convenience.
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------
  deploy-backend:
    name: Deploy API
    needs: build-image
    runs-on: ubuntu-latest
    outputs:
      app_name: ${{ steps.appname.outputs.name }}
      api_url: ${{ steps.urls.outputs.api_url }}
      site_url: ${{ steps.urls.outputs.site_url }}
      storage_account: ${{ steps.urls.outputs.storage_account }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: >-
            backendImage=${{ needs.build-image.outputs.image }}
            apiNameSuffix=${{ vars.API_NAME_SUFFIX }}
            ghcrUsername=${{ github.actor }}
            ghcrToken=${{ secrets.GHCR_PULL_TOKEN }}
            jwtSecret=${{ secrets.JWT_SECRET }}
            jwtRefreshSecret=${{ secrets.JWT_REFRESH_SECRET }}
            corsOrigin=${{ secrets.CORS_ORIGIN }}
          failOnStdErr: false

      - name: Resolve names from the deployment output
        id: appname
        # apiNameSuffix changes the container app's name, so never hard-code
        # it - read back what the template actually created.
        run: |
          name=$(az deployment group show             --resource-group "$AZURE_RESOURCE_GROUP" --name main             --query properties.outputs.backendAppName.value -o tsv)
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "Deployed container app: ${name}"

      - name: Roll the API to this image
        run: |
          az containerapp update             --name "${{ steps.appname.outputs.name }}"             --resource-group "$AZURE_RESOURCE_GROUP"             --image "${{ needs.build-image.outputs.image }}"

      - name: Read deployed URLs
        id: urls
        run: |
          api_fqdn=$(az deployment group show             --resource-group "$AZURE_RESOURCE_GROUP" --name main             --query properties.outputs.backendFqdn.value -o tsv)
          storage=$(az deployment group show             --resource-group "$AZURE_RESOURCE_GROUP" --name main             --query properties.outputs.frontendStorageAccount.value -o tsv)
          site=$(az deployment group show             --resource-group "$AZURE_RESOURCE_GROUP" --name main             --query properties.outputs.frontendUrl.value -o tsv)
          echo "api_url=https://${api_fqdn}/api" >> "$GITHUB_OUTPUT"
          echo "storage_account=${storage}" >> "$GITHUB_OUTPUT"
          echo "site_url=${site%/}" >> "$GITHUB_OUTPUT"

      - name: Smoke test the health endpoint
        run: |
          api_url="${{ steps.urls.outputs.api_url }}"
          for attempt in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${api_url}/health" || true)
            if [ "$code" = "200" ]; then
              echo "healthy after ${attempt} attempt(s)"
              exit 0
            fi
            echo "attempt ${attempt}: got ${code}, retrying..."
            sleep 10
          done
          echo "API never became healthy. Recent logs:"
          az containerapp logs show             --name "${{ steps.appname.outputs.name }}"             --resource-group "$AZURE_RESOURCE_GROUP" --tail 60 || true
          exit 1

  deploy-frontend:
    name: Deploy frontend
    needs: [build-image, deploy-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        # VITE_* variables are substituted at build time and frozen into the
        # bundle, so the API URL has to be known here, not at runtime.
        env:
          VITE_API_URL: ${{ needs.deploy-backend.outputs.api_url }}
        run: npm run build --prefix frontend

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Enable static website hosting
        # Data-plane setting, so ARM cannot do it. index.html doubles as the
        # error document, giving the React SPA its deep-link fallback.
        run: |
          az storage blob service-properties update             --account-name "${{ needs.deploy-backend.outputs.storage_account }}"             --static-website --auth-mode login             --index-document index.html             --404-document index.html

      - name: Upload the bundle
        run: |
          az storage blob upload-batch             --account-name "${{ needs.deploy-backend.outputs.storage_account }}"             --auth-mode login             --destination '$web'             --source frontend/dist             --overwrite

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Frontend | ${{ needs.deploy-backend.outputs.site_url }} |"
            echo "| API | ${{ needs.deploy-backend.outputs.api_url }} |"
            echo "| App | \`${{ needs.deploy-backend.outputs.app_name }}\` |"
            echo "| Image | \`${{ needs.build-image.outputs.image }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
